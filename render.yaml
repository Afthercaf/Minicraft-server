# Blueprint de Render: despliega backend + frontend juntos.
# Dashboard de Render -> New -> Blueprint -> conecta el repo con este archivo.
services:
  # ================= BACKEND (API Node.js) =================
  - type: web
    name: mc-admin-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /healthz
    envVars:
      - key: FRONTEND_URL
        value: https://minicraft-server-z7uz.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPERADMIN_EMAIL
        value: afthercaft10@gmail.com
      - key: RCON_HOST
        sync: false
      - key: RCON_PORT
        value: "8443"
      - key: RCON_PASSWORD
        sync: false
      - key: RCON_TLS
        value: "true"

  # ================= FRONTEND (React estatico) =================
  - type: web
    name: mc-admin-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        # El frontend de Render se conecta directamente al backend protegido
        # de la PC por Tailscale Funnel. /redis es solo el punto HTTPS;
        # Redis NO se expone a Internet.
        value: https://killerexpert10.tail29c8ce.ts.net/redis
    routes:
      # SPA: todas las rutas caen en index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Mismos headers del MD auditado (92/100 en infraestructura)
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - path: /*
        name: Content-Security-Policy
        value: default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://killerexpert10.tail29c8ce.ts.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self'
